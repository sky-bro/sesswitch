name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/sesswitch

  vicinae:
    name: Vicinae extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vicinae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vicinae/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -- --out "$RUNNER_TEMP/sesswitch-vicinae"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
      - run: bash scripts/test-install-codex-hook.sh
